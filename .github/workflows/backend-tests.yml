
name: Finvora - Certificacion Backend

on:
  workflow_dispatch:
    inputs:
      categoria:
        description: Tipo de prueba
        required: true
        default: Todas
        type: choice
        options:
          - Todas
          - Unitarias
          - Caja blanca
          - Integracion
          - Seguridad
          - Confiabilidad
          - Validacion predictiva (logica)
          - Exactitud predictiva (backtesting)
          - Rendimiento (interno)
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Pruebas automatizadas del backend
    runs-on: ubuntu-latest
    env:
      CATEGORIA: ${{ inputs.categoria || 'Todas' }}
      SPRING_DATASOURCE_URL: 'jdbc:h2:mem:finvora_qa;DB_CLOSE_DELAY=-1;MODE=PostgreSQL'
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ''

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Otorgar permisos a Gradle
        run: chmod +x gradlew

      - name: Ejecutar pruebas
        shell: bash
        run: |
          args=()
          case "$CATEGORIA" in
            Todas|"Caja blanca") ;;
            Unitarias) args=(--tests '*.service.*Test' --tests '*.controller.*Test' --tests '*AesEncryptorTest' --tests '*JwtTokenProviderTest') ;;
            Integracion) args=(--tests '*.integration.SistemaIntegracionTest' --tests '*StockmasterBackendApplicationTests') ;;
            Seguridad) args=(--tests '*.security.*Test' --tests '*AuthServiceTest' --tests '*UsuarioServiceTest' --tests '*ProductoControllerTest') ;;
            Confiabilidad) args=(--tests '*.reliability.*Test' --tests '*CompraServiceTest' --tests '*VentaServiceTest' --tests '*ProductoServiceTest' --tests '*SimulacionFinancieraServiceTest' --tests '*FlujoCajaIaServiceTest') ;;
            "Validacion predictiva (logica)") args=(--tests '*FlujoCajaIaServiceTest' --tests '*SimulacionFinancieraServiceTest') ;;
            "Exactitud predictiva (backtesting)") args=(--tests "*ExactitudPredictivaTest") ;;
            "Rendimiento (interno)") args=(--tests '*RendimientoEscalabilidadTest') ;;
            *) echo "Categoria desconocida"; exit 1 ;;
          esac
          ./gradlew clean test --console=plain "${args[@]}"

      - name: Generar resumen de resultados
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = glob.glob(
              "build/test-results/test/TEST-*.xml"
          )

          total = failures = errors = skipped = 0

          for file in files:
              root = ET.parse(file).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))

          passed = total - failures - errors - skipped

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# Certificación Backend - Finvora\n\n")
              f.write(f"**Categoria:** {os.environ['CATEGORIA']}\n\n")
              f.write("Cobertura del conjunto seleccionado respecto al backend completo. Las categorias pueden compartir casos.\n\n")
              f.write("| Indicador | Resultado |\n")
              f.write("|---|---:|\n")
              f.write(f"| Total de pruebas | {total} |\n")
              f.write(f"| Aprobadas | {passed} |\n")
              f.write(f"| Fallidas | {failures} |\n")
              f.write(f"| Errores | {errors} |\n")
              f.write(f"| Omitidas | {skipped} |\n")

              coverage = "build/reports/jacoco/test/jacocoTestReport.xml"
              if os.path.exists(coverage):
                  f.write("\n## Cobertura JaCoCo\n\n")
                  for counter in ET.parse(coverage).getroot().findall("counter"):
                      kind = counter.get("type")
                      covered = int(counter.get("covered", 0))
                      missed = int(counter.get("missed", 0))
                      if kind in ("LINE", "BRANCH", "METHOD") and covered + missed:
                          f.write(f"- {kind}: {100 * covered / (covered + missed):.2f}% ({covered}/{covered + missed})\n")

              f.write("\n## Detalle por clase\n\n| Clase | Total | Fallos | Errores | Omitidas |\n|---|---:|---:|---:|---:|\n")
              for file in sorted(files):
                  root = ET.parse(file).getroot()
                  f.write(f"| {root.get('name')} | {root.get('tests', 0)} | {root.get('failures', 0)} | {root.get('errors', 0)} | {root.get('skipped', 0)} |\n")
              if not files:
                  f.write("\nNo se encontraron resultados de pruebas.\n")

          if not files or total == 0:
              raise SystemExit(1)
          PY

      - name: Publicar resumen predictivo
        if: always()
        run: |
          if [ -f build/reports/predictive/summary.md ]; then
            cat build/reports/predictive/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Finvora-Reporte-Backend
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/jacoco/test/
            build/reports/predictive/
          retention-days: 30
